<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quizz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">

    <section id="home-screen">
      <h1>Quizz</h1>
      <p>Pick a quiz to start. You need 60% to pass.</p>
      <p id="home-msg" class="note"></p>
      <div id="quiz-list"></div>
      <button id="create-btn" class="secondary">+ Make your own quiz</button>
    </section>

    <section id="quiz-screen" class="hidden">
      <p id="progress"></p>
      <h2 id="question"></h2>
      <div id="options"></div>
    </section>

    <section id="result-screen" class="hidden">
      <h2>Your Result</h2>
      <p id="score"></p>
      <p id="time"></p>
      <p id="message"></p>
      <div class="row">
        <button id="restart-btn" class="primary">Try Again</button>
        <button id="home-btn" class="secondary">Home</button>
      </div>
    </section>

    <section id="create-screen" class="hidden create-form">
      <h2>Make your own quiz</h2>
      <input id="quiz-title" type="text" placeholder="Quiz title" maxlength="80">
      <div id="question-blocks"></div>
      <button id="add-question-btn" class="secondary">+ Add question</button>
      <p id="create-error" class="error"></p>
      <div class="row">
        <button id="save-quiz-btn" class="primary">Save quiz</button>
        <button id="cancel-btn" class="secondary">Cancel</button>
      </div>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
